[package]
name = "opence_cli"
description = "The opence tool: the developer shell of a running engine, over its control socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opence"
path = "src/main.rs"

[dependencies]
# (`opence bake`: each BSP's lightmaps, baked at import)
opence_bake.workspace = true
opence_census.workspace = true
opence_content.workspace = true
opence_dev.workspace = true
opence_import.workspace = true
serde_json = "1"
rustyline = { version = "17", default-features = false, features = ["with-file-history", "derive"] }

[lints]
workspace = true
