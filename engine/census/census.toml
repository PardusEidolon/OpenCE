# The coverage census's manifest: the class of each function of the
# original (source/) and the evidence for it. docs/census.md says what each
# class needs; `opence census --check` fails when a function lacks it.
#
# Rules class whole directories, files or name prefixes; a [function.NAME]
# entry classes one function and beats any rule. A function a reference
# trace compiles (traced.tsv) is Ported without an entry. `owed` says why
# evidence is still lacking, for the coverage-completion track.

[[rule]]
class = "missing"

# The systems ported from the original and matched to it: their functions
# stay Missing until classed, even where the original's renderer is their
# only caller (it drives the weather, decals, HUD and score screens).

[[rule]]
directory = "ai"
class = "missing"
through_callers = false

[[rule]]
directory = "camera"
class = "missing"
through_callers = false

[[rule]]
directory = "cutscene"
class = "missing"
through_callers = false

[[rule]]
directory = "devices"
class = "missing"
through_callers = false

[[rule]]
directory = "effects"
class = "missing"
through_callers = false

[[rule]]
directory = "game"
class = "missing"
through_callers = false

[[rule]]
directory = "hs"
class = "missing"
through_callers = false

[[rule]]
directory = "interface"
class = "missing"
through_callers = false

[[rule]]
directory = "items"
class = "missing"
through_callers = false

[[rule]]
directory = "models"
class = "missing"
through_callers = false

[[rule]]
directory = "objects"
class = "missing"
through_callers = false

[[rule]]
directory = "physics"
class = "missing"
through_callers = false

[[rule]]
directory = "sound"
class = "missing"
through_callers = false

[[rule]]
directory = "units"
class = "missing"
through_callers = false

# Replaced on purpose: code whose job the engine does another way, with no
# behaviour to match. A function they alone reach is Replaced through its
# caller.

[[rule]]
directory = "rasterizer"
class = "replaced"
because = "renderer"
